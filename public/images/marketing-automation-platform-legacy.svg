<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1760" viewBox="0 0 2200 1760" role="img" aria-labelledby="title desc">
  <title id="title">营销自动化平台旧架构图</title>
  <desc id="desc">重构前基于 Go 微服务和应用内 DAG 执行器的营销自动化平台。运营工作台经活动 API 网关访问核心服务，活动执行引擎依赖 Kafka、Redis、MySQL 等组件完成事件消费、节点执行、等待调度和状态恢复。</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2468e8"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#f05a18"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8147f5"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#18a852"/></marker>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#64748b" flood-opacity="0.18"/></filter>
    <style>
      text { font-family: 'PingFang SC','Microsoft YaHei',Arial,sans-serif; letter-spacing: 0; }
      .title { font-size: 40px; font-weight: 700; fill: #2468e8; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #687386; }
      .section { font-size: 20px; font-weight: 700; }
      .box-title { font-size: 20px; font-weight: 700; }
      .box-body { font-size: 16px; font-weight: 400; fill: #667085; }
      .small { font-size: 14px; font-weight: 500; fill: #667085; }
      .tiny { font-size: 13px; font-weight: 500; fill: #667085; }
      .engine-label { font-size: 17px; font-weight: 600; }
      .zone { fill: #fbfdff; stroke-width: 2; stroke-dasharray: 10 8; }
      .card { fill: #fff; stroke-width: 2; filter: url(#shadow); }
      .flow-blue { fill: none; stroke: #2468e8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .flow-orange { fill: none; stroke: #f05a18; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .flow-purple { fill: none; stroke: #8147f5; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
      .flow-green { fill: none; stroke: #18a852; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="2200" height="1760" fill="#ffffff"/>
  <text x="1100" y="55" text-anchor="middle" class="title">营销自动化平台旧架构图</text>
  <text x="1100" y="88" text-anchor="middle" class="subtitle">Legacy Go DAG-based Marketing Automation Platform Architecture</text>

  <!-- Operations console -->
  <rect x="65" y="112" width="2070" height="145" rx="14" class="zone" fill="#f4f8ff" stroke="#9cc8ff"/>
  <text x="92" y="141" class="section" fill="#2468e8">运营工作台 / OPERATIONS CONSOLE（React Flow 低代码画布）</text>
  <g fill="#fff" stroke="#9cc8ff" class="card">
    <rect x="170" y="163" width="300" height="66" rx="10"/>
    <rect x="625" y="163" width="300" height="66" rx="10"/>
    <rect x="1080" y="163" width="300" height="66" rx="10"/>
    <rect x="1535" y="163" width="300" height="66" rx="10"/>
  </g>
  <g class="box-title" fill="#2468e8" text-anchor="middle">
    <text x="320" y="205">活动管理</text>
    <text x="775" y="205">可视化画布</text>
    <text x="1230" y="205">触发器配置</text>
    <text x="1685" y="205">监控大屏</text>
  </g>
  <path d="M320 257 V285" class="flow-blue"/>
  <path d="M775 257 V285" class="flow-blue"/>
  <path d="M1230 257 V285" class="flow-blue"/>
  <path d="M1685 257 V285" class="flow-blue"/>

  <!-- Gateway -->
  <rect x="65" y="285" width="2070" height="120" rx="14" fill="#eef5ff" stroke="#2468e8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1100" y="340" text-anchor="middle" class="box-title" fill="#2468e8">活动 API 网关</text>
  <text x="1100" y="369" text-anchor="middle" class="box-body" fill="#78a9f6">鉴权 · 限流 · 灰度路由</text>
  <path d="M1100 405 V451" class="flow-blue"/>

  <!-- Core engine -->
  <rect x="65" y="452" width="2070" height="250" rx="14" class="zone" fill="#fbfdff" stroke="#9cc8ff"/>
  <text x="92" y="486" class="section" fill="#2468e8">核心引擎层 / CORE ENGINE LAYER</text>
  <g stroke="#63a5ff">
    <g><rect x="105" y="520" width="440" height="145" rx="14" class="card"/><path d="M105 534 Q105 520 119 520 H531 Q545 520 545 534 V574 H105 Z" fill="#1f5fd6" stroke="none"/><text x="325" y="556" text-anchor="middle" class="box-title" fill="#fff">可视化画布服务</text><text x="325" y="610" text-anchor="middle" class="box-body" fill="#475467" font-weight="500">React Flow · 拖拽编排</text><text x="325" y="638" text-anchor="middle" class="box-body" fill="#475467" font-weight="500">DAG 构建 / 校验 · 节点库</text></g>
    <g><rect x="620" y="520" width="440" height="145" rx="14" class="card"/><path d="M620 534 Q620 520 634 520 H1046 Q1060 520 1060 534 V574 H620 Z" fill="#1f5fd6" stroke="none"/><text x="840" y="556" text-anchor="middle" class="box-title" fill="#fff">规则引擎</text><text x="840" y="610" text-anchor="middle" class="box-body" fill="#475467" font-weight="500">Expr / 自研 DSL 编译缓存</text><text x="840" y="638" text-anchor="middle" class="box-body" fill="#475467" font-weight="500">热更新 · 无需重启</text></g>
    <g><rect x="1135" y="520" width="440" height="145" rx="14" class="card"/><path d="M1135 534 Q1135 520 1149 520 H1561 Q1575 520 1575 534 V574 H1135 Z" fill="#1f5fd6" stroke="none"/><text x="1355" y="556" text-anchor="middle" class="box-title" fill="#fff">触发器服务</text><text x="1355" y="610" text-anchor="middle" class="box-body" fill="#475467" font-weight="500">事件驱动 · 定时 / 手动触发</text><text x="1355" y="638" text-anchor="middle" class="box-body" fill="#475467" font-weight="500">HTTP · gRPC · Webhook</text></g>
    <g><rect x="1650" y="520" width="440" height="145" rx="14" class="card"/><path d="M1650 534 Q1650 520 1664 520 H2076 Q2090 520 2090 534 V574 H1650 Z" fill="#1f5fd6" stroke="none"/><text x="1870" y="556" text-anchor="middle" class="box-title" fill="#fff">版本管理</text><text x="1870" y="610" text-anchor="middle" class="box-body" fill="#475467" font-weight="500">灰度发布 · AB 分流</text><text x="1870" y="638" text-anchor="middle" class="box-body" fill="#475467" font-weight="500">一键回滚 · 版本对比</text></g>
  </g>

  <!-- Activity execution engine -->
  <rect x="65" y="724" width="2070" height="390" rx="14" class="zone" fill="#f8fffb" stroke="#76e7a4"/>
  <text x="92" y="758" class="section" fill="#18a852">DAG 活动执行引擎 / ACTIVITY EXECUTION ENGINE（Go 应用内运行态）</text>
  <g class="small" text-anchor="middle">
    <rect x="130" y="787" width="330" height="54" rx="9" fill="#fff" stroke="#7cb1ff" stroke-width="2"/><text x="295" y="820" class="engine-label" fill="#2468e8">Kafka Consumer · HTTP · gRPC</text>
    <rect x="535" y="787" width="330" height="54" rx="9" fill="#fff" stroke="#a77bff" stroke-width="2"/><text x="700" y="820" class="engine-label" fill="#8147f5">内存 DAG + Context</text>
    <rect x="940" y="787" width="330" height="54" rx="9" fill="#fff" stroke="#72d79a" stroke-width="2"/><text x="1105" y="820" class="engine-label" fill="#18a852">goroutine 节点执行器</text>
    <rect x="1345" y="787" width="330" height="54" rx="9" fill="#fff" stroke="#ffad78" stroke-width="2"/><text x="1510" y="820" class="engine-label" fill="#f05a18">Redis ZSet / Time Wheel</text>
    <rect x="1750" y="787" width="330" height="54" rx="9" fill="#fff" stroke="#aeb7c4" stroke-width="2"/><text x="1915" y="812" class="engine-label" fill="#667085">Redis / MySQL 状态</text><text x="1915" y="831" class="tiny">去重 · 实例 · 日志 · 唯一索引</text>
  </g>
  <path d="M460 814 H535" class="flow-blue"/><path d="M865 814 H940" class="flow-purple"/><path d="M1270 814 H1345" class="flow-green"/><path d="M1675 814 H1750" class="flow-orange"/>

  <!-- Sample DAG -->
  <g class="box-title" text-anchor="middle">
    <rect x="100" y="905" width="185" height="70" rx="11" fill="#fff" stroke="#2468e8" stroke-width="3"/><text x="192" y="947" fill="#2468e8">开始</text>
    <rect x="385" y="905" width="210" height="70" rx="11" fill="#fff" stroke="#8147f5" stroke-width="3"/><text x="490" y="947" fill="#8147f5">用户分群</text>
    <path d="M745 890 L815 940 L745 990 L675 940 Z" fill="#fff" stroke="#f05a18" stroke-width="3"/><text x="745" y="935" fill="#f05a18" font-size="16">条件判断</text><text x="745" y="956" class="tiny" fill="#f05a18">高价值 / 普通</text>
    <rect x="915" y="875" width="200" height="70" rx="11" fill="#fff" stroke="#8147f5" stroke-width="3"/><text x="1015" y="917" fill="#8147f5">发券</text>
    <rect x="915" y="1005" width="200" height="70" rx="11" fill="#fff" stroke="#f05a18" stroke-width="3"/><text x="1015" y="1047" fill="#f05a18">延迟等待</text>
    <rect x="1215" y="1005" width="200" height="70" rx="11" fill="#fff" stroke="#f05a18" stroke-width="3"/><text x="1315" y="1047" fill="#f05a18">发消息</text>
    <path d="M1545 890 L1615 940 L1545 990 L1475 940 Z" fill="#fff" stroke="#18a852" stroke-width="3"/><text x="1545" y="947" fill="#18a852" font-size="17">并行网关</text>
    <rect x="1710" y="905" width="190" height="70" rx="11" fill="#fff" stroke="#f59e0b" stroke-width="3"/><text x="1805" y="947" fill="#e99300">AB 分流</text>
    <rect x="1980" y="905" width="105" height="70" rx="11" fill="#fff" stroke="#2468e8" stroke-width="3"/><text x="2032" y="947" fill="#2468e8">结束</text>
  </g>
  <path d="M285 940 H385" class="flow-blue"/><path d="M595 940 H675" class="flow-blue"/>
  <path d="M815 940 H855 V910 H915" class="flow-purple"/><text x="882" y="900" class="tiny" fill="#8147f5">高价值</text>
  <path d="M745 990 V1040 H915" class="flow-orange"/><text x="785" y="1028" class="tiny" fill="#f05a18">普通</text>
  <path d="M1115 910 H1517" class="flow-purple"/><path d="M1115 1040 H1215" class="flow-orange"/><path d="M1415 1040 H1445 V940 H1475" class="flow-orange"/>
  <path d="M1615 940 H1710" class="flow-green"/><path d="M1900 940 H1980" class="flow-blue"/>

  <!-- Monitor -->
  <rect x="65" y="1135" width="2070" height="120" rx="14" class="zone" fill="#fffafa" stroke="#ffaaa7"/>
  <text x="92" y="1167" class="section" fill="#ef3434">监控与归因 / MONITOR &amp; ATTRIBUTION</text>
  <g class="box-title" text-anchor="middle">
    <rect x="160" y="1184" width="360" height="52" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="340" y="1217" fill="#ef4444">实时监控</text>
    <rect x="650" y="1184" width="360" height="52" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="830" y="1217" fill="#e99300">效果归因</text>
    <rect x="1140" y="1184" width="360" height="52" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="1320" y="1217" fill="#ef4444">异常告警</text>
    <rect x="1630" y="1184" width="360" height="52" rx="10" fill="#fff" stroke="#2468e8" stroke-width="2"/><text x="1810" y="1217" fill="#2468e8">数据导出</text>
  </g>
  <path d="M340 1114 V1135" class="flow-blue"/><path d="M830 1114 V1135" class="flow-blue"/><path d="M1320 1114 V1135" class="flow-blue"/><path d="M1810 1114 V1135" class="flow-blue"/>

  <!-- Data and infra -->
  <rect x="65" y="1278" width="2070" height="135" rx="14" class="zone" fill="#fbfcfe" stroke="#c7d0dc"/>
  <text x="92" y="1310" class="section" fill="#667085">数据与基础设施 / DATA &amp; INFRA</text>
  <g text-anchor="middle" class="box-title">
    <g><rect x="110" y="1330" width="290" height="64" rx="10" fill="#fff" stroke="#c7d0dc" stroke-width="2" filter="url(#shadow)"/><text x="255" y="1358" fill="#ef3434">Redis</text><text x="255" y="1380" class="small" fill="#ef3434">状态缓存 · 锁 · 延迟任务</text></g>
    <g><rect x="445" y="1330" width="290" height="64" rx="10" fill="#fff" stroke="#c7d0dc" stroke-width="2" filter="url(#shadow)"/><text x="590" y="1358" fill="#2468e8">MySQL</text><text x="590" y="1380" class="small" fill="#2468e8">活动 · 节点 · 实例 · 日志</text></g>
    <g><rect x="780" y="1330" width="290" height="64" rx="10" fill="#fff" stroke="#c7d0dc" stroke-width="2" filter="url(#shadow)"/><text x="925" y="1358" fill="#202124">Kafka</text><text x="925" y="1380" class="small" fill="#202124">事件流 · 解耦</text></g>
    <g><rect x="1115" y="1330" width="290" height="64" rx="10" fill="#fff" stroke="#c7d0dc" stroke-width="2" filter="url(#shadow)"/><text x="1260" y="1358" fill="#f59e0b">Elasticsearch</text><text x="1260" y="1380" class="small" fill="#f59e0b">执行日志检索</text></g>
    <g><rect x="1450" y="1330" width="290" height="64" rx="10" fill="#fff" stroke="#c7d0dc" stroke-width="2" filter="url(#shadow)"/><text x="1595" y="1358" fill="#8147f5">ClickHouse</text><text x="1595" y="1380" class="small" fill="#8147f5">效果分析</text></g>
    <g><rect x="1785" y="1330" width="290" height="64" rx="10" fill="#fff" stroke="#c7d0dc" stroke-width="2" filter="url(#shadow)"/><text x="1930" y="1358" fill="#0f9f8d">Nacos</text><text x="1930" y="1380" class="small" fill="#0f9f8d">配置中心</text></g>
  </g>

  <!-- External -->
  <rect x="65" y="1437" width="2070" height="145" rx="14" class="zone" fill="#f8fbff" stroke="#9cc8ff"/>
  <text x="92" y="1470" class="section" fill="#2468e8">对外协作 / EXTERNAL TRIGGERS &amp; CALLBACKS</text>
  <g class="box-title" text-anchor="middle">
    <g><rect x="190" y="1495" width="380" height="66" rx="10" fill="#fff" stroke="#9cc8ff" stroke-width="2" filter="url(#shadow)"/><text x="380" y="1522" fill="#f05a18">消息平台</text><text x="380" y="1546" class="small" fill="#f05a18">发消息节点</text></g>
    <g><rect x="685" y="1495" width="380" height="66" rx="10" fill="#fff" stroke="#9cc8ff" stroke-width="2" filter="url(#shadow)"/><text x="875" y="1522" fill="#8147f5">卡券 / 福利平台</text><text x="875" y="1546" class="small" fill="#8147f5">发券节点</text></g>
    <g><rect x="1180" y="1495" width="380" height="66" rx="10" fill="#fff" stroke="#9cc8ff" stroke-width="2" filter="url(#shadow)"/><text x="1370" y="1522" fill="#2468e8">用户系统</text><text x="1370" y="1546" class="small" fill="#2468e8">注册 / 登录事件</text></g>
    <g><rect x="1675" y="1495" width="380" height="66" rx="10" fill="#fff" stroke="#9cc8ff" stroke-width="2" filter="url(#shadow)"/><text x="1865" y="1522" fill="#18a852">任务系统</text><text x="1865" y="1546" class="small" fill="#18a852">任务事件</text></g>
  </g>

  <!-- Legend -->
  <rect x="65" y="1605" width="2070" height="120" rx="14" fill="#fbfcfe" stroke="#d5dae2" stroke-width="2"/>
  <text x="92" y="1640" class="section" fill="#374151">画布节点类型</text>
  <g class="small" text-anchor="middle" font-weight="700">
    <rect x="250" y="1627" width="150" height="45" rx="7" fill="#fff" stroke="#2468e8" stroke-width="2"/><text x="325" y="1655" fill="#2468e8">开始 / 结束</text>
    <rect x="445" y="1627" width="150" height="45" rx="7" fill="#fff" stroke="#f05a18" stroke-width="2"/><text x="520" y="1655" fill="#f05a18">条件判断</text>
    <rect x="640" y="1627" width="150" height="45" rx="7" fill="#fff" stroke="#18a852" stroke-width="2"/><text x="715" y="1655" fill="#18a852">并行网关</text>
    <rect x="835" y="1627" width="150" height="45" rx="7" fill="#fff" stroke="#f05a18" stroke-width="2"/><text x="910" y="1655" fill="#f05a18">发消息</text>
    <rect x="1030" y="1627" width="150" height="45" rx="7" fill="#fff" stroke="#8147f5" stroke-width="2"/><text x="1105" y="1655" fill="#8147f5">发券</text>
    <rect x="1225" y="1627" width="150" height="45" rx="7" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="1300" y="1655" fill="#e99300">AB 分流</text>
    <rect x="1420" y="1627" width="150" height="45" rx="7" fill="#fff" stroke="#0f9f8d" stroke-width="2"/><text x="1495" y="1655" fill="#0f9f8d">延迟等待</text>
    <rect x="1615" y="1627" width="150" height="45" rx="7" fill="#fff" stroke="#667085" stroke-width="2"/><text x="1690" y="1655" fill="#667085">外部 API</text>
  </g>
  <text x="92" y="1703" class="small" fill="#667085">图例：</text>
  <line x1="155" y1="1698" x2="205" y2="1698" stroke="#2468e8" stroke-width="3"/><text x="220" y="1703" class="small">请求流</text>
  <line x1="330" y1="1698" x2="380" y2="1698" stroke="#f05a18" stroke-width="3"/><text x="395" y="1703" class="small">条件分支</text>
  <line x1="535" y1="1698" x2="585" y2="1698" stroke="#8147f5" stroke-width="3"/><text x="600" y="1703" class="small">外部调用</text>
  <line x1="740" y1="1698" x2="790" y2="1698" stroke="#18a852" stroke-width="3"/><text x="805" y="1703" class="small">并行汇聚</text>
  <text x="1010" y="1703" class="small" fill="#667085">核心技术：React Flow 画布 · DAG + 状态机编排 · Expr / DSL 规则引擎 · Kafka 事件驱动 · Redis / MySQL 运行态</text>
</svg>
