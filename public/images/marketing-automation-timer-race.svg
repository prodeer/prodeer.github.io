<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="680" viewBox="0 0 1700 680" role="img" aria-labelledby="title desc">
  <title id="title">Timer 与事件竞争处理</title>
  <desc id="desc">进入 WAIT 节点后，事件和 Timer 作为两个并列竞争输入，分别产生事件先到或 Timer 先到的结果。两条路径都经过 expected_node、revision 和 timer_generation 校验，并共同汇入唯一合法状态结果。</desc>
  <defs>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ea580c"/></marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; }
      .section { font: 700 18px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }
      .node-title { font: 600 17px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
      .node-body { font: 400 13.5px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; }
      .node-small { font: 400 12px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; }
      .tag { font: 600 11.5px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #fff; }
      .node { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .flow-green { fill: none; stroke: #15803d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .flow-orange { fill: none; stroke: #ea580c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .flow-gray { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; marker-end: url(#arrow-gray); }
      .label { font: 500 12px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="bg" width="1700" height="680"/>
  <text x="850" y="48" text-anchor="middle" class="title">Timer 与事件竞争：先到者推进，后到者空操作</text>
  <text x="850" y="78" text-anchor="middle" class="subtitle">expected_node + revision + timer_generation 让竞态变成可验证的状态前置条件</text>

  <!-- Wait state -->
  <rect x="40" y="145" width="250" height="265" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="65" y="180" class="section" fill="#15803d">进入等待</text>
  <rect x="70" y="230" width="190" height="105" rx="8" class="node"/>
  <rect x="70" y="230" width="190" height="26" rx="8" fill="#15803d"/><text x="87" y="248" class="tag">WAIT_EVENT</text>
  <text x="165" y="286" text-anchor="middle" class="node-title">保存等待状态</text>
  <text x="165" y="312" text-anchor="middle" class="node-small">node · revision · deadline</text>

  <!-- Competing inputs -->
  <rect x="340" y="115" width="430" height="325" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="365" y="150" class="section" fill="#1d4ed8">同一实例的两个竞争输入</text>
  <rect x="385" y="190" width="340" height="90" rx="8" class="node"/>
  <rect x="385" y="190" width="340" height="25" rx="8" fill="#2563eb"/><text x="403" y="208" class="tag">EVENT</text>
  <text x="555" y="249" text-anchor="middle" class="node-title">KYC_SUCCESS 到达</text>
  <text x="555" y="270" text-anchor="middle" class="node-small">携带 event_time 与 revision</text>
  <rect x="385" y="315" width="340" height="90" rx="8" class="node"/>
  <rect x="385" y="315" width="340" height="25" rx="8" fill="#7c3aed"/><text x="403" y="333" class="tag">TIMER</text>
  <text x="555" y="374" text-anchor="middle" class="node-title">deadline 到期</text>
  <text x="555" y="395" text-anchor="middle" class="node-small">触发超时 JourneyCommand</text>

  <!-- Parallel race outcomes -->
  <rect x="840" y="130" width="320" height="140" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="865" y="165" class="section" fill="#15803d">事件先到</text>
  <text x="880" y="205" class="node-title">删除 Timer · 推进事件分支</text>
  <text x="880" y="235" class="node-small">revision 增加，节点改变</text>

  <rect x="840" y="300" width="320" height="140" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="865" y="335" class="section" fill="#c2410c">Timer 先到</text>
  <text x="880" y="375" class="node-title">推进超时分支</text>
  <text x="880" y="405" class="node-small">事件后到校验失败，只能 no-op</text>

  <!-- Common result -->
  <rect x="1240" y="190" width="410" height="190" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1270" y="225" class="section" fill="#475569">共同结果</text>
  <text x="1285" y="270" class="node-title">状态只沿一条合法路径前进</text>
  <text x="1285" y="304" class="node-body">不会重复发券，也不会由旧命令回退节点</text>
  <text x="1285" y="338" class="node-small">最终结果进入审计和镜像</text>

  <!-- Flow -->
  <path d="M290 275 H340" class="flow-green"/>
  <path d="M725 235 H785 V200 H840" class="flow-green"/>
  <path d="M725 360 H785 V370 H840" class="flow-orange"/>
  <path d="M1160 200 H1195 V250 H1240" class="flow-gray"/>
  <path d="M1160 370 H1210 V320 H1240" class="flow-gray"/>

  <!-- Shared preconditions -->
  <rect x="340" y="480" width="1310" height="110" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="365" y="515" class="section" fill="#c2410c">统一前置条件</text>
  <text x="590" y="515" class="node-title">expected_node = wait_kyc</text>
  <text x="880" y="515" class="node-title">expected_revision = 7</text>
  <text x="1150" y="515" class="node-title">timer_generation = 1</text>
  <text x="995" y="555" text-anchor="middle" class="node-body">两条路径使用相同校验；先推进者改变状态，后到的旧命令不能覆盖新状态</text>

  <text x="850" y="640" text-anchor="middle" class="label">deadline 附近必须定义确定性规则，例如 event_time &lt;= deadline 才接受事件分支</text>
</svg>
