<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="880" viewBox="0 0 1700 880" role="img" aria-labelledby="title desc">
  <title id="title">JourneyInstance 状态模型</title>
  <desc id="desc">JourneyInstance 引用不可变 JourneyVersion，并由 instances、waitIndex、dedupState、pendingActions 和 timerMetadata 共同组成用户旅程运行态。</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; }
      .section { font: 700 20px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }
      .node-title { font: 600 19px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
      .node-body { font: 400 15px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; }
      .node-small { font: 400 14px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; }
      .tag { font: 600 13px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #fff; }
      .node { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.8; stroke-linecap: round; marker-end: url(#arrow-blue); }
      .flow-purple { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
    </style>
  </defs>
  <rect class="bg" width="1700" height="880"/>
  <text x="850" y="48" text-anchor="middle" class="title">JourneyInstance：用户旅程运行态模型</text>
  <text x="850" y="78" text-anchor="middle" class="subtitle">实例只引用不可变版本，辅助索引保证按事件精确唤醒和安全去重</text>

  <rect x="60" y="125" width="390" height="720" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="88" y="162" class="section" fill="#1d4ed8">不可变定义</text>
  <rect x="100" y="215" width="310" height="180" rx="8" class="node"/>
  <rect x="100" y="215" width="310" height="28" rx="8" fill="#2563eb"/><text x="118" y="235" class="tag">Broadcast State</text>
  <text x="255" y="278" text-anchor="middle" class="node-title">JourneyVersion = 12</text>
  <text x="255" y="312" text-anchor="middle" class="node-body">NodeDefinition[]</text>
  <text x="255" y="340" text-anchor="middle" class="node-body">EdgeDefinition[]</text>
  <text x="255" y="368" text-anchor="middle" class="node-small">definition_hash · sequence · gate</text>
  <text x="255" y="445" text-anchor="middle" class="node-small">实例不复制整张 DAG，只保存版本引用</text>

  <rect x="505" y="125" width="690" height="720" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="535" y="162" class="section" fill="#15803d">Keyed State：JourneyInstance</text>
  <rect x="555" y="215" width="590" height="270" rx="8" class="node"/>
  <rect x="555" y="215" width="590" height="28" rx="8" fill="#15803d"/><text x="573" y="235" class="tag">MapState&lt;instance_id, JourneyInstanceState&gt;</text>
  <text x="585" y="280" class="node-title">instance_id / tenant_id / user_id</text>
  <text x="585" y="314" class="node-title">journey_id / journey_version / revision</text>
  <text x="585" y="348" class="node-title">status / current_node / active_tokens</text>
  <text x="585" y="382" class="node-body">context：注册来源、风险等级和已声明字段</text>
  <text x="585" y="416" class="node-body">waiting：event_type、deadline、timer_id、generation</text>
  <text x="585" y="452" class="node-small">单分支旅程退化为单 Token，并行分支显式声明 ALL / ANY</text>

  <rect x="555" y="545" width="270" height="115" rx="8" class="node"/>
  <rect x="555" y="545" width="270" height="25" rx="8" fill="#7c3aed"/><text x="573" y="563" class="tag">waitIndex</text>
  <text x="690" y="603" text-anchor="middle" class="node-title">事件类型</text><text x="690" y="628" text-anchor="middle" class="node-body">-> 实例 / Token 索引</text>

  <rect x="875" y="545" width="270" height="115" rx="8" class="node"/>
  <rect x="875" y="545" width="270" height="25" rx="8" fill="#475569"/><text x="893" y="563" class="tag">dedupState</text>
  <text x="1010" y="603" text-anchor="middle" class="node-title">event / command / Timer</text><text x="1010" y="628" text-anchor="middle" class="node-body">TTL 去重键</text>

  <rect x="555" y="700" width="270" height="115" rx="8" class="node"/>
  <rect x="555" y="700" width="270" height="25" rx="8" fill="#ea580c"/><text x="573" y="718" class="tag">pendingActions</text>
  <text x="690" y="758" text-anchor="middle" class="node-title">已发出动作</text><text x="690" y="783" text-anchor="middle" class="node-body">等待最终结果</text>

  <rect x="875" y="700" width="270" height="115" rx="8" class="node"/>
  <rect x="875" y="700" width="270" height="25" rx="8" fill="#0f766e"/><text x="893" y="718" class="tag">timerMetadata</text>
  <text x="1010" y="758" text-anchor="middle" class="node-title">Timer 注册信息</text><text x="1010" y="783" text-anchor="middle" class="node-body">node · deadline · generation</text>

  <rect x="1250" y="125" width="390" height="720" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1280" y="162" class="section" fill="#c2410c">运行时约束</text>
  <text x="1280" y="225" class="node-title">单用户活跃 Journey 上限</text>
  <text x="1280" y="270" class="node-title">单实例上下文大小上限</text>
  <text x="1280" y="315" class="node-title">单实例活跃 Token 上限</text>
  <text x="1280" y="360" class="node-title">单 Journey 最大等待时长</text>
  <text x="1280" y="425" class="node-body">完成实例保留有限时间</text>
  <text x="1280" y="452" class="node-body">节点流水转入审计系统</text>
  <text x="1280" y="479" class="node-body">运行态由 TTL 自动清理</text>
  <text x="1280" y="560" class="node-small">查询投影可重建</text>
  <text x="1280" y="588" class="node-small">外部系统不能直接写入 State</text>

  <path d="M450 330 H505" class="flow-blue"/>
  <path d="M1195 330 H1250" class="flow-purple"/>
  <path d="M690 485 V545" class="flow-blue"/>
  <path d="M1010 485 V545" class="flow-blue"/>
  <path d="M620 485 V510 H530 V680 H690 V700" class="flow-blue"/>
  <path d="M1080 485 V510 H1170 V680 H1010 V700" class="flow-blue"/>
</svg>
