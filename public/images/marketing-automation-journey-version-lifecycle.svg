<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="840" viewBox="0 0 1800 840" role="img" aria-labelledby="title desc">
  <title id="title">JourneyVersion 生命周期与灰度</title>
  <desc id="desc">JourneyVersion 从草稿、校验、仿真、审批、灰度到不可变发布。新实例使用新版本，存量实例继续旧版本，活跃引用归零并经过安全保留期后发送 Tombstone。</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; }
      .section { font: 700 20px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; }
      .node-title { font: 600 19px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
      .node-body { font: 400 15px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; }
      .node-small { font: 400 14px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; }
      .tag { font: 600 13px 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; fill: #fff; }
      .node { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.8; stroke-linecap: round; marker-end: url(#arrow-blue); }
      .flow-green { fill: none; stroke: #15803d; stroke-width: 2.8; stroke-linecap: round; marker-end: url(#arrow-green); }
      .flow-gray { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 8 6; marker-end: url(#arrow-gray); }
    </style>
  </defs>
  <rect class="bg" width="1800" height="840"/>
  <text x="900" y="48" text-anchor="middle" class="title">JourneyVersion：发布、灰度与回收生命周期</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">定义不可变，版本切换影响新实例，存量实例继续引用创建时的版本</text>

  <rect x="55" y="120" width="1690" height="275" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="80" y="155" class="section" fill="#1d4ed8">控制面发布链路</text>
  <g>
    <rect x="95" y="225" width="220" height="90" rx="8" class="node"/><rect x="95" y="225" width="220" height="25" rx="8" fill="#64748b"/><text x="112" y="243" class="tag">DRAFT</text><text x="205" y="280" text-anchor="middle" class="node-title">草稿</text><text x="205" y="301" text-anchor="middle" class="node-small">画布与配置</text>
    <rect x="370" y="225" width="220" height="90" rx="8" class="node"/><rect x="370" y="225" width="220" height="25" rx="8" fill="#2563eb"/><text x="388" y="243" class="tag">VALIDATE</text><text x="480" y="280" text-anchor="middle" class="node-title">静态校验</text><text x="480" y="301" text-anchor="middle" class="node-small">编译执行计划</text>
    <rect x="645" y="225" width="220" height="90" rx="8" class="node"/><rect x="645" y="225" width="220" height="25" rx="8" fill="#2563eb"/><text x="663" y="243" class="tag">SIMULATE</text><text x="755" y="280" text-anchor="middle" class="node-title">仿真</text><text x="755" y="301" text-anchor="middle" class="node-small">历史事件回放</text>
    <rect x="920" y="225" width="220" height="90" rx="8" class="node"/><rect x="920" y="225" width="220" height="25" rx="8" fill="#7c3aed"/><text x="938" y="243" class="tag">APPROVE</text><text x="1030" y="280" text-anchor="middle" class="node-title">审批</text><text x="1030" y="301" text-anchor="middle" class="node-small">策略与风险确认</text>
    <rect x="1195" y="225" width="220" height="90" rx="8" class="node"/><rect x="1195" y="225" width="220" height="25" rx="8" fill="#15803d"/><text x="1213" y="243" class="tag">GRAY</text><text x="1305" y="280" text-anchor="middle" class="node-title">灰度</text><text x="1305" y="301" text-anchor="middle" class="node-small">用户哈希 / 白名单</text>
    <rect x="1470" y="225" width="220" height="90" rx="8" class="node"/><rect x="1470" y="225" width="220" height="25" rx="8" fill="#0f766e"/><text x="1488" y="243" class="tag">PUBLISH</text><text x="1580" y="280" text-anchor="middle" class="node-title">不可变发布</text><text x="1580" y="301" text-anchor="middle" class="node-small">sequence / hash</text>
  </g>
  <path d="M315 270 H370" class="flow-blue"/><path d="M590 270 H645" class="flow-blue"/><path d="M865 270 H920" class="flow-blue"/><path d="M1140 270 H1195" class="flow-green"/><path d="M1415 270 H1470" class="flow-green"/>

  <rect x="55" y="465" width="1690" height="275" rx="12" fill="#ecfdf5" stroke="#86efac"/>
  <text x="80" y="500" class="section" fill="#15803d">版本并存与回收</text>
  <rect x="120" y="555" width="450" height="105" rx="8" class="node"/><rect x="120" y="555" width="450" height="26" rx="8" fill="#15803d"/><text x="138" y="574" class="tag">NEW INSTANCES</text><text x="345" y="615" text-anchor="middle" class="node-title">新实例 -> 新 JourneyVersion</text><text x="345" y="640" text-anchor="middle" class="node-small">新事件按灰度规则选择版本</text>
  <rect x="675" y="555" width="450" height="105" rx="8" class="node"/><rect x="675" y="555" width="450" height="26" rx="8" fill="#475569"/><text x="693" y="574" class="tag">RUNNING INSTANCES</text><text x="900" y="615" text-anchor="middle" class="node-title">存量实例 -> 创建时的旧版本</text><text x="900" y="640" text-anchor="middle" class="node-small">默认自然完成，不强制迁移</text>
  <rect x="1230" y="555" width="420" height="105" rx="8" class="node"/><rect x="1230" y="555" width="420" height="26" rx="8" fill="#dc2626"/><text x="1248" y="574" class="tag">RETIRE</text><text x="1440" y="615" text-anchor="middle" class="node-title">引用归零 + 安全保留期</text><text x="1440" y="640" text-anchor="middle" class="node-small">发送 Tombstone，回收 Broadcast State</text>
  <path d="M1540 315 V390 H345 V555" class="flow-green"/><path d="M1580 315 V420 H900 V555" class="flow-gray"/><path d="M1620 315 V450 H1440 V555" class="flow-gray"/>
  <text x="900" y="800" text-anchor="middle" class="node-small">暂停：关闭入口准入；止损：通过运行时闸门抑制动作，不改写已发布 DAG</text>
</svg>
